name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: npm exchanges this OIDC token for short-lived
      # publish credentials, so no long-lived NPM_TOKEN (and no 2FA prompt).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          # setup-node above owns the Node version; borrow only the `vp` binary.
          node-manager: false
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp test

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
          else
            TAG="latest"
          fi
          echo "Publishing $VERSION with dist-tag: $TAG"
          npm publish --tag "$TAG"
